<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bot Universe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Watch a team of practice trading bots race with fake money, live.">
<meta property="og:title" content="Bot Universe">
<meta property="og:description" content="Watch a team of practice trading bots race with fake money, live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a living star map on the left (center core + 9 bot galaxies), a reading panel on the right; stacked on phones. Single deliberate dark "deep space" look. */
:root {
  --void: #05060d;
  --ink: #e9ecff;
  --dim: #8c93b6;
  --faint: #5a6086;
  --line: rgba(150, 165, 255, 0.14);
  --panel: rgba(9, 11, 24, 0.86);
  --raise: rgba(255, 255, 255, 0.04);
  --gold: #f6b94c;
  --cyan: #63d6ff;
  --core: #b8a4ff;
  --up: #4fe3a1;
  --down: #ff6b7d;
  --warn: #ffc857;
  --display: "Michroma", "Eurostile", "Arial Black", sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
img { max-width: 100%; }
html, body { height: 100%; margin: 0; }
body { background: var(--void); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 410px; height: 100%; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; }
.stage.dragging { cursor: grabbing; }
.stage::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 150px; z-index: 3; pointer-events: none; background: linear-gradient(rgba(5, 6, 13, 0.92) 55%, rgba(5, 6, 13, 0)); }
.masthead { z-index: 4; }
.stage.dragging .node { pointer-events: none; }
.zoombar { position: absolute; z-index: 4; right: max(14px, env(safe-area-inset-right, 0px)); bottom: 14px; display: flex; gap: 4px; }
.zoombar button { min-width: 34px; height: 34px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(9, 11, 24, 0.82); color: var(--ink); font: 600 14px/1 var(--body); cursor: pointer; }
.zoombar button:hover, .zoombar button:focus-visible { border-color: var(--core); outline: none; }
.howto { position: absolute; z-index: 3; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 18px; margin: 0; font-size: 11px; color: var(--faint); pointer-events: none; }
.stage.far .node .st { display: none; }
.stage.veryfar .node:not(.center) .ch { display: none; }
.node.ghostnode .nm { text-transform: none; letter-spacing: 0.04em; font-family: var(--body); font-size: 10.5px; color: var(--dim); }
.node.ghostnode .st { font-size: 9.5px; color: var(--faint); }
.node.ghostnode .ch { font-size: 10px; opacity: 0.8; }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.masthead { position: absolute; top: 18px; left: max(20px, env(safe-area-inset-left, 0px)); right: 16px; z-index: 3; pointer-events: none; display: grid; gap: 6px; justify-items: start; }
.masthead h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 15px; letter-spacing: 0.32em; text-transform: uppercase; }
.masthead p { margin: 0; color: var(--dim); font-size: 12px; }
.live { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; color: var(--dim); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--up); box-shadow: 0 0 10px var(--up); }
.live.off i { background: var(--down); box-shadow: 0 0 10px var(--down); }
.hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 3; color: var(--faint); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; pointer-events: none; white-space: nowrap; }

.node { position: absolute; z-index: 2; border-radius: 50%; border: 0; background: transparent; cursor: pointer; padding: 0; }
.node:focus-visible { outline: 1px dashed var(--ink); outline-offset: 6px; }
.node .tag { position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%) scale(var(--ls, 1)); transform-origin: top center; display: grid; justify-items: center; gap: 1px; white-space: nowrap; pointer-events: none; }
.node .nm { font-family: var(--display); font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink); text-shadow: 0 0 8px var(--void), 0 0 2px var(--void); }
.node .ch { font-family: var(--mono); font-size: 11px; text-shadow: 0 0 6px var(--void); }
.node .v { text-transform: none; letter-spacing: 0.04em; }
.node.botnode .nm { text-transform: none; letter-spacing: 0.06em; }
.node.groupnode .nm { font-size: 11px; letter-spacing: 0.22em; }
.node.groupnode.open .st::after { content: " · open"; }
.node .st { max-width: 10em; white-space: normal; text-align: center; line-height: 1.15; }
.crumbs { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); pointer-events: auto; flex-wrap: wrap; }
.crumbs:empty { display: none; }
.crumbs button { border: 0; background: transparent; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0; font-size: 12px; }
.crumbs b { font-weight: 600; color: var(--ink); }
.node .st { font-size: 10px; color: var(--dim); text-shadow: 0 0 6px var(--void), 0 0 2px var(--void); }
.node.center .tag { top: 50%; transform: translate(-50%, -50%) scale(var(--ls, 1)); transform-origin: center; }
.node.center .nm { font-size: 11px; letter-spacing: 0.34em; }
.node:hover .nm, .node.sel .nm { color: #fff; }

.panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-width: 0; backdrop-filter: blur(10px); }
.panel-in { padding-block: 26px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
.eyebrow { font-family: var(--display); font-size: 9.5px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--dim); display: flex; gap: 10px; align-items: center; }
.eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; }
h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: 0.08em; text-wrap: balance; }
.lede { margin: 0; color: var(--dim); max-width: 62ch; }
.big { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.big b { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; }
.big span { font-size: 14px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--dim); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--line); background: var(--raise); white-space: nowrap; }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.holding { color: var(--up); } .chip.cash { color: var(--dim); } .chip.stopped { color: var(--warn); }
.sec { display: grid; gap: 10px; }
.sec h3 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.facts div { background: var(--void); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.facts dt { color: var(--faint); font-size: 11px; }
.facts dd { margin: 0; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.rank { display: grid; gap: 2px; }
.rank button { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto 64px; gap: 10px; align-items: center; padding: 8px 8px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; }
.rank button:hover, .rank button:focus-visible { background: var(--raise); outline: none; }
.rank .n { font-family: var(--mono); color: var(--faint); font-size: 11px; }
.rank .who { display: grid; min-width: 0; }
.rank .who b { font-weight: 600; font-size: 13px; }
.rank .who small { color: var(--faint); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .pct { font-family: var(--mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 2px; background: var(--line); position: relative; overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.trades { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.trades td, .trades th { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.trades th { color: var(--faint); font-weight: 500; font-size: 11px; }
.trades td.num { font-family: var(--mono); text-align: right; }
.tw { overflow-x: auto; }
.links { display: grid; gap: 6px; }
.links button { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; }
.links button:hover, .links button:focus-visible { border-color: var(--core); outline: none; }
.links b { font-family: var(--display); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 400; }
.links span { color: var(--dim); font-size: 12.5px; }
.idea { display: grid; gap: 4px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); }
.idea b { font-weight: 600; }
.idea span { color: var(--dim); font-size: 12.5px; }
.back { justify-self: start; border: 0; background: transparent; color: var(--dim); cursor: pointer; padding: 0; font-size: 12.5px; }
.back:hover, .back:focus-visible { color: var(--ink); outline: none; }
.spark { width: 100%; height: auto; display: block; }
.note { color: var(--faint); font-size: 12px; margin: 0; }
.report { white-space: pre-wrap; font-size: 12.5px; color: var(--dim); background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; max-height: 320px; overflow: auto; margin: 0; font-family: var(--body); }
.report strong { color: var(--ink); }
.foot { color: var(--faint); font-size: 11.5px; border-top: 1px solid var(--line); padding-top: 14px; margin: 0; }
.err { color: var(--down); }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: transparent; color: var(--dim); border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--raise); color: var(--ink); border-color: rgba(184, 164, 255, 0.5); }
.tabs button:focus-visible { outline: 1px dashed var(--ink); outline-offset: 2px; }
.chart { height: 280px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: rgba(0, 0, 0, 0.25); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 2px; border-radius: 1px; }
.next { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid rgba(184, 164, 255, 0.35); border-radius: 10px; background: rgba(184, 164, 255, 0.07); }
.next span { font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--core); }
.next p { margin: 0; color: var(--ink); }
@keyframes blink { from { background: rgba(255, 255, 255, 0.12); } to { background: transparent; } }
.blink { animation: blink 0.9s ease-out; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { .blink { animation: none; } }

.moods { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 10.5px; color: var(--dim); margin-top: 2px; }
.moods span { display: inline-flex; align-items: center; gap: 5px; }
.moods i { width: 7px; height: 7px; border-radius: 50%; }
.flame { width: 9px; height: 12px; flex: none; }
.node .nm { display: inline-flex; align-items: center; gap: 4px; }
.eli5 { display: grid; gap: 6px; padding: 12px 14px; border-radius: 10px; background: rgba(246, 185, 76, 0.07); border: 1px solid rgba(246, 185, 76, 0.28); }
.eli5 > span { font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.eli5 p { margin: 0; font-size: 14px; color: var(--ink); max-width: 62ch; }
.eli5 b { color: var(--gold); font-weight: 600; }
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.share { border: 1px solid var(--line); background: var(--raise); border-radius: 999px; padding: 4px 12px; font-size: 12px; color: var(--ink); cursor: pointer; justify-self: start; }
.share:hover, .share:focus-visible { border-color: var(--core); outline: none; }
.sharebox { width: 100%; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--void); color: var(--ink); font-family: var(--mono); font-size: 12px; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { display: block; height: auto; }
  .stage { height: 74vh; min-height: 520px; max-height: 720px; }
  .howto { display: none; }
  .stage::before { height: 190px; }
  .node .nm { font-size: 8.5px; letter-spacing: 0.14em; }
  .node .ch { font-size: 10px; }
  .node .st { font-size: 9px; }
  .node.crowded .st { display: none; }
  .panel { border-left: 0; border-top: 1px solid var(--line); backdrop-filter: none; background: var(--void); }
  .hint { display: none; }
}
</style>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="masthead">
      <h1>Bot Universe</h1>
      <p><span id="botCount">Practice</span> trading bots · fake money · tap a galaxy to look inside</p>
      <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
      <span class="live" id="live"><i></i><span id="liveText">Loading…</span></span>
      <div class="moods" aria-label="Color key"><span><i style="background:#f6b94c;box-shadow:0 0 8px #f6b94c"></i>Doing fine</span><span><i style="background:#4fb8ff;box-shadow:0 0 8px #4fb8ff"></i>Making money (+1% or more)</span><span><svg class="flame" viewBox="0 0 12 16" aria-hidden="true"><path d="M6 0c1 4 5 6 5 10.5a5 5 0 0 1-10 0C1 8 2.5 6.5 3.5 5.5c.1 1.5.8 2.5 1.7 2.8C4.6 5.5 5 2.5 6 0z" fill="#ff6a3d"/><path d="M6 8c.5 2 2.5 3 2.5 5a2.5 2.5 0 0 1-5 0c0-1.2.8-2 1.4-2.6C5 9.7 5.5 8.8 6 8z" fill="#ffd166"/></svg>Losing money (−1% or more)</span></div>
    </div>
    <div id="nodes"></div>
    <div class="zoombar" id="zoombar" aria-label="Look around">
      <button type="button" data-z="in" aria-label="Zoom in">+</button>
      <button type="button" data-z="out" aria-label="Zoom out">−</button>
      <button type="button" data-z="fit" aria-label="Fit everything on screen">Fit</button>
      <button type="button" data-z="all" id="openAll" aria-label="Open or close every galaxy">Open all</button>
    </div>
    <p class="howto">Tap a galaxy to open it · drag to look around · scroll or pinch to zoom</p>
  </div>
  <aside class="panel" id="panel" aria-live="polite">
    <div class="panel-in" id="panelIn"><p class="note">Loading the bots…</p></div>
  </aside>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(() => {
  const COLORS = { fine: "#f6b94c", up: "#4fb8ff", down: "#ff5a3c", core: "#b8a4ff", crypto: "#f6b94c", stock: "#63d6ff" };
  const GOOD = 0.01;   // +1% = making money (blue), -1% = losing money (red, on fire), in between = fine (gold)
  const moodOf = c => c >= GOOD ? "up" : c <= -GOOD ? "down" : "fine";
  // Ring order keeps related bots next to each other.
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage = document.getElementById("stage");
  const cv = document.getElementById("sky");
  const ctx = cv.getContext("2d");
  const nodesEl = document.getElementById("nodes");
  const panelIn = document.getElementById("panelIn");
  let data = null, nodes = [], links = [], W = 0, H = 0, dpr = 1, stars = null, selected = null;

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = v => "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: Math.abs(v) < 1 && v !== 0 ? 6 : 2 });
  const pct = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(2) + "%";
  const tone = v => v > 0.00005 ? "up" : v < -0.00005 ? "down" : "flat";
  const et = iso => new Date(iso).toLocaleString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " ET";
  const barName = b => ({ "15m": "15-minute prices", "1h": "hourly prices", "4h": "4-hour prices", "1d": "daily prices" }[b] || b);
  const statusText = b => b.status === "holding" ? `Holding ${b.symbol.replace("/USD", "")}` : b.status === "stopped" ? "Paused after stop-loss" : "Waiting in cash";

  // ---------- particles ----------
  function sprite(color, size) {
    const c = document.createElement("canvas"); c.width = c.height = size;
    const g = c.getContext("2d"), r = size / 2;
    const grd = g.createRadialGradient(r, r, 0, r, r, r);
    grd.addColorStop(0, "rgba(255,255,255,1)"); grd.addColorStop(0.25, color); grd.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = grd; g.fillRect(0, 0, size, size); return c;
  }
  const SPRITES = {};
  for (const [k, v] of Object.entries(COLORS)) SPRITES[k] = sprite(v, 64);
  SPRITES.white = sprite("#ffffff", 32);
  SPRITES.flame = sprite("#ff7a2e", 32);
  SPRITES.ember = sprite("#ffd166", 32);

  const rand = (a, b) => a + Math.random() * (b - a);
  function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }

  function makeSphere(n) {   // the central "all bots" orb: a shell of points with swirling filaments
    const pts = [];
    for (let i = 0; i < n; i++) {
      const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
      const shell = i % 3 === 0 ? rand(0.2, 0.95) : rand(0.82, 1.0);
      const s = Math.sqrt(1 - u * u);
      pts.push({ x: s * Math.cos(th) * shell, y: u * shell, z: s * Math.sin(th) * shell, a: rand(0.25, 0.9), w: Math.random() < 0.08 ? 1 : 0 });
    }
    for (let f = 0; f < 5; f++) {   // filaments
      const ax = rand(0, Math.PI * 2), tilt = rand(-1, 1);
      for (let i = 0; i < 90; i++) {
        const t = i / 90 * Math.PI * 2, r = 0.55 + 0.25 * Math.sin(t * 3 + f);
        pts.push({ x: Math.cos(t + ax) * r, y: Math.sin(t) * tilt * r, z: Math.sin(t + ax) * r, a: 0.9, w: 1 });
      }
    }
    return pts;
  }
  function makeSpiral(n, arms) {   // a face-on spiral galaxy: bright core, curved arms, soft haze
    const pts = [];
    for (let i = 0; i < n; i++) {
      const kind = Math.random();
      if (kind < 0.18) {             // core bulge
        const r = Math.abs(gauss()) * 0.22;
        pts.push({ r, th: Math.random() * Math.PI * 2, a: rand(0.5, 1), w: 1 });
      } else if (kind < 0.38) {      // faint disk haze between the arms
        const r = Math.sqrt(Math.random()) * 0.95;
        pts.push({ r, th: Math.random() * Math.PI * 2, a: rand(0.1, 0.35), w: 0 });
      } else {                       // the arms
        const r = 0.12 + Math.pow(Math.random(), 0.8) * 0.88;
        const arm = (i % arms) / arms * Math.PI * 2;
        const th = arm + Math.log(1 + r * 6) * 1.9 + gauss() * 0.22 * (0.6 + r);
        pts.push({ r, th, a: rand(0.35, 1) * (1 - r * 0.45), w: Math.random() < 0.05 ? 1 : 0 });
      }
    }
    return pts;
  }

  // ---------- layout ----------
  // One page. The core sits in the middle with one galaxy per asset around it. Tapping a
  // galaxy opens it right there: its bots branch outward from it. Any number of galaxies can
  // be open at once; open ones get a wider slice of the circle, and the circle grows so nothing
  // overlaps. Positions are "world" units; the camera turns them into screen positions (drag to
  // look around, scroll or pinch to zoom).
  let animStart = -1e9, LW = 1, PX = 1, camAnim = null;
  const expanded = new Set();          // ids of open galaxies
  const nodeMap = new Map();           // id -> node, kept between changes so things glide
  const ANIM = 700;
  const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const cam = { s: 1, x: 0, y: 0 };
  let userMoved = false;
  const toScreen = (wx, wy) => ({ x: wx * cam.s + cam.x, y: wy * cam.s + cam.y });
  const topInset = () => document.querySelector(".masthead").offsetHeight + (W < 600 ? 24 : 16);
  const BOT_GAP = 180, ROW_GAP = 205, FIRST_ROW = 300, GROUP_GAP = 280;
  const rowsFor = n => n > 20 ? 3 : n > 9 ? 2 : 1;

  function groupNeed(g, R) {           // how much of the circle (radians) a galaxy needs
    if (!expanded.has(g.id)) return GROUP_GAP / R;
    const per = Math.ceil(g.bots.length / rowsFor(g.bots.length));
    return Math.max(GROUP_GAP / R, per * BOT_GAP / (R + FIRST_ROW));
  }

    panelIn.innerHTML = `
      <div class="toprow"><button type="button" class="back" data-go="all">← All galaxies</button>${shareBtn("Copy link to this galaxy")}</div>
      <div class="eyebrow"><span class="dot" style="background:${COLORS[moodOf(c)]};box-shadow:0 0 10px ${COLORS[moodOf(c)]}"></span>${g.asset === "crypto" ? "Crypto galaxy" : "Stock market galaxy"}</div>
      <h2>${esc(g.name)}</h2>
      <p class="lede">${g.portfolio ? `One portfolio split into ${g.bots.length} equal slices, one per coin: ${esc(g.bots.map(b => b.asset_name).join(", "))}.` : `${g.bots.length} bot${g.bots.length > 1 ? "s" : ""} trading ${esc(g.symbol_name || g.symbol)}.`} Tap one of the small universes to see what it's doing.</p>
      ${eli5(g.why, g.kid)}
      <div class="big"><b>${esc(money(groupValue(g)))}</b><span class="${tone(c)}">${esc(pct(c))}</span><span class="flat">from ${esc(money(groupBudget(g)))}</span></div>
      <dl class="facts">
        ${g.portfolio ? `<div><dt>Coins in it</dt><dd>${g.bots.length}</dd></div>` : `<div><dt>${esc(coin(g.symbol))} price${live[g.symbol] ? " (live)" : ""}</dt><dd data-live="price|${esc(g.symbol)}">${esc(money(priceOf(g.symbol)))}</dd></div>`}
        <div><dt>Holding right now</dt><dd>${holding} of ${g.bots.length}</dd></div>
      </dl>
      ${g.portfolio ? "" : `<section class="sec">
        <div class="tabs" role="tablist">${MODES(pseudo).map(([m, label]) => `<button type="button" role="tab" data-mode="${m}" aria-selected="${m === chartMode}">${esc(label)}</button>`).join("")}</div>
        <div id="chart" class="chart"></div>
        <div class="legend" id="chartLegend"></div>
      </section>`}
      <section class="sec"><h3>Its bots</h3>${botRows(ranked)}</section>
      <p class="foot">Fake money on a practice account. Bot data from ${esc(et(data.generated))}.</p>`;
    paintLive();
    if (!g.portfolio) mountChart(pseudo);
  }

  function renderBot(b) {
    const n = nodes.find(x => x.id === b.name);
    const rel = data.links.filter(l => l.a === b.name || l.b === b.name);
    const bt = b.backtest, mc = b.monte_carlo, plan = b.plan || { lines: [] };
    const latest = b.latest ? `${b.latest.wants ? "Rule says: own it" : "Rule says: stay out"} → ${b.latest.action}` : "No check yet";
    const holding = b.qty > 0;
    panelIn.innerHTML = `
      <div class="toprow"><button type="button" class="back" data-go="${esc((groupOf(b) || {}).id || "all")}">← ${esc((groupOf(b) || {}).name || "All bots")} galaxy</button>${shareBtn("Copy link to this bot")}</div>
      <div class="eyebrow"><span class="dot" style="background:${n.color};box-shadow:0 0 10px ${n.color}"></span>Trading ${esc(b.symbol_name || b.symbol)}</div>
      <h2>${esc(titleOf(b))}</h2>
      <p class="note">Bot ID: ${esc(b.name)}</p>
      <p class="lede">${esc(b.plain || b.description)}</p>
      ${b.twin_of ? `<p class="note">Marketplace twin: a paper copy of <b>${esc(b.twin_of)}</b>, tested on our own data.</p>` : ""}
      ${eli5(b.why, b.kid)}
      <div class="big"><b data-live="value|${esc(b.name)}">${esc(money(valueOf(b)))}</b><span data-live="change|${esc(b.name)}" class="${tone(changeOf(b))}">${esc(pct(changeOf(b)))}</span>${chip(b)}</div>
      <dl class="facts">
        <div><dt>${esc(coin(b.symbol))} price${b.asset === "crypto" ? " (live)" : ""}</dt><dd data-live="price|${esc(b.symbol)}">${esc(money(priceOf(b.symbol)))}</dd></div>
        <div><dt>Bought in at</dt><dd>${holding ? esc(money(b.entry)) : "Not holding"}</dd></div>
        ${holding ? `<div><dt>Since it bought</dt><dd data-live="pl|${esc(b.name)}">…</dd></div>` : `<div><dt>Cash waiting</dt><dd>${esc(money(b.cash))}</dd></div>`}
        ${plan.stop_price ? `<div><dt>Stop-loss at ${esc(money(plan.stop_price))}</dt><dd data-live="stopgap|${esc(b.name)}">…</dd></div>`
          : `<div><dt>Owns</dt><dd>${holding ? `${esc(Number(b.qty).toFixed(b.asset === "crypto" ? 6 : 4))} ${esc(coin(b.symbol))}` : "Nothing"}</dd></div>`}
      </dl>
      <section class="sec">
        <div class="tabs" role="tablist">${MODES(b).map(([m, label]) => `<button type="button" role="tab" data-mode="${m}" aria-selected="${m === chartMode}">${esc(label)}</button>`).join("")}</div>
        <div id="chart" class="chart"></div>
        <div class="legend" id="chartLegend"></div>
      </section>
      <section class="sec"><h3>The plan</h3>
        <div class="next"><span>Next move</span><p>${esc(plan.next || "")}</p></div>
        ${plan.lines.length ? `<dl class="facts">${plan.lines.map(l => `<div><dt>${esc(l.label)}</dt><dd>${esc(typeof l.value === "number" ? money(l.value) : l.value)}</dd></div>`).join("")}</dl>` : ""}
        <p class="note">${esc(latest)}${b.latest ? ` · checked ${esc(et(b.latest.time))}` : ""}</p>
      </section>
      <dl class="facts">
        <div><dt>Looks at</dt><dd>${esc(barName(b.bar))}</dd></div>
        <div><dt>Order type</dt><dd>${b.orders === "limit" ? "Limit (cheaper)" : "Market"}</dd></div>
        <div><dt>5% stop-loss</dt><dd>${b.stop_loss ? "On" : "Off"}</dd></div>
        <div><dt>Trades so far</dt><dd>${b.trade_count}</dd></div>
      </dl>
      <section class="sec"><h3>Bot value over time</h3>${spark(b.history)}</section>
      ${bt ? `<section class="sec"><h3>Tested on the past 2 years</h3>
        <dl class="facts">
          <div><dt>Full 2 years</dt><dd>${esc(bt.two_years)}</dd></div>
          <div><dt>Chance of losing*</dt><dd>${esc(mc && mc.chance_losing ? mc.chance_losing : "Not enough trades")}</dd></div>
          <div><dt>Year 1</dt><dd>${esc(bt.year1)}</dd></div>
          <div><dt>Year 2</dt><dd>${esc(bt.year2)}</dd></div>
        </dl>
        <p class="note">*From replaying the bot's past trades in random order 5,000 times. Past results don't predict future ones.</p></section>` : ""}
      ${labSection(b.lab)}
      ${rel.length ? `<section class="sec"><h3>Connected universes</h3><div class="links">${rel.map(l => {
        const other = l.a === b.name ? l.b : l.a;
        return `<button type="button" data-go="${esc(other)}"><b>${esc(titleById(other))}</b><span>${esc(l.why)}</span></button>`;
      }).join("")}</div></section>` : ""}
      <section class="sec"><h3>Trades (${b.trade_count})</h3>${tradesTable([...b.trades].reverse(), false)}</section>
      <p class="foot">Fake money on a practice account. ${b.asset === "crypto" ? "Live prices from Coinbase; the bot trades on Alpaca, so its prices can differ slightly. " : "Stock prices update every few minutes while the market is open. "}Bot data from ${esc(et(data.generated))}.</p>`;
    paintLive();
    mountChart(b);
  }

  function select(id, fromHash) {
    if (id !== "all" && !byId(id) && !groupById(id)) id = "all";
    if (id !== selected) chartMode = "bot";
    // opening a galaxy or a bot opens its galaxy on the map
    const g = groupById(id) || (byId(id) && !byId(id).retired ? groupOf(byId(id)) : null);
    if (g && !expanded.has(g.id)) { expanded.add(g.id); syncNodes(); }
    selected = id;
    for (const n of nodes) n.el.classList.toggle("sel", n.id === id);
    if (chart && (id === "all")) { chart.remove(); chart = null; mainSeries = null; chartKind = null; }
    if (id === "all") renderAll(); else if (groupById(id)) renderGroup(groupById(id)); else renderBot(byId(id));
    const crumb = document.getElementById("crumbs");
    crumb.innerHTML = g ? `<button type="button" data-go="all">All galaxies</button><span>›</span><button type="button" data-go="${esc(g.id)}">${esc(g.name)}</button>${byId(id) ? `<span>›</span><b>${esc("v" + byId(id).version)}</b>` : ""}` : "";
    document.getElementById("panel").scrollTop = 0;
    if (!fromHash && location.hash.slice(1) !== id && !(id === "all" && !location.hash)) location.hash = id;
    const oa = document.getElementById("openAll"); if (oa) oa.textContent = expanded.size === groups.length ? "Close all" : "Open all";
    if (reduce) draw(0);
  }
  function tapNode(n) {
    if (n.kind === "core") { select("all"); return; }
    if (n.kind === "group") {
      if (!expanded.has(n.id)) { expanded.add(n.id); syncNodes(); select(n.id); }
      else if (selected === n.id) { expanded.delete(n.id); syncNodes(); select("all"); }
      else select(n.id);
      return;
    }
    select(selected === n.id ? n.parent.id : n.id);
  }
  function onGo(e) {
    const sh = e.target.closest("[data-share]");
    if (sh) { share(sh); return; }
    const tab = e.target.closest("[data-mode]");
    if (tab) {
      chartMode = tab.dataset.mode;
      for (const t of panelIn.querySelectorAll("[data-mode]")) t.setAttribute("aria-selected", t === tab);
      const gsel = groupById(selected);
      mountChart(gsel ? { name: gsel.id, asset: gsel.asset, symbol: gsel.symbol, rule: "hold", bar: "1h", trades: [], plan: {}, qty: 0 } : byId(selected));
      return;
    }
    const go = e.target.closest("[data-go]"); if (!go) return;
    select(go.dataset.go);
    if (matchMedia("(max-width: 860px)").matches && go.closest("#panelIn")) stage.scrollIntoView({ behavior: reduce ? "auto" : "smooth" });
  }
  panelIn.addEventListener("click", onGo);
  document.getElementById("crumbs").addEventListener("click", onGo);
  addEventListener("hashchange", () => select(location.hash.slice(1) || "all", true));

  // ---------- boot ----------
  const small = () => innerWidth < 600;
  const FLAME = `<svg class="flame" hidden viewBox="0 0 12 16" aria-hidden="true"><path d="M6 0c1 4 5 6 5 10.5a5 5 0 0 1-10 0C1 8 2.5 6.5 3.5 5.5c.1 1.5.8 2.5 1.7 2.8C4.6 5.5 5 2.5 6 0z" fill="#ff6a3d"/><path d="M6 8c.5 2 2.5 3 2.5 5a2.5 2.5 0 0 1-5 0c0-1.2.8-2 1.4-2.6C5 9.7 5.5 8.8 6 8z" fill="#ffd166"/></svg>`;
  function makeNode(id, kind, obj, parent) {
    const n = { id, kind, parent, color: kind === "core" ? COLORS.core : COLORS.fine, mood: "fine",
                phase: Math.random(), tilt: rand(0, Math.PI * 2), r: kind === "core" ? 140 : kind === "group" ? 72 : 36, fresh: true };
    if (kind === "core") n.pts = makeSphere(small() ? 900 : 1500);
    else if (kind === "group") { n.group = obj; n.pts = makeSpiral(small() ? 420 : 700, 2); }
    else { n.bot = obj; n.pts = makeSpiral((small() ? 240 : 400) * (obj.status === "holding" ? 1.25 : 1), obj.rule === "regime" ? 3 : 2); }
    const el = document.createElement("button");
    el.type = "button";
    el.className = "node" + (kind === "core" ? " center" : "") + (kind === "bot" ? " botnode" : "") + (kind === "group" ? " groupnode" : "");
    let name, sub = "";
    if (kind === "core") name = "All bots";
    else if (kind === "group") { name = obj.name; sub = `${obj.bots.length} bot${obj.bots.length > 1 ? "s" : ""}`; }
    else if (obj.group) { name = obj.asset_name; sub = "slice"; }
    else { name = `v${obj.version || 1}`; sub = obj.strategy || ""; }
    el.setAttribute("aria-label", kind === "bot" ? `${titleOf(obj)}, ${statusText(obj)}`
      : kind === "group" ? `${obj.name} galaxy, ${obj.bots.length} bots. Tap to open or close.` : "All bots summary");
    el.innerHTML = `<span class="tag"><span class="nm">${kind === "core" ? "" : FLAME}${esc(name)}</span>${sub ? `<span class="st">${esc(sub)}</span>` : ""}<span class="ch"></span></span>`;
    el.style.opacity = "0";
    el.addEventListener("click", () => { if (dragDist > 6) return; tapNode(n); });
    n.el = el; nodesEl.appendChild(el);
    // new nodes grow out of their parent
    const from = parent || { x: 0, y: 0 };
    n.x = n.sx = from.x ?? 0; n.y = n.sy = from.y ?? 0;
    return n;
  }
  function syncNodes() {
    const want = new Map();
    const core = nodeMap.get("all") || makeNode("all", "core", null, null);
    want.set("all", core);
    for (const g of groups) {
      const gn = nodeMap.get(g.id) || makeNode(g.id, "group", g, core);
      gn.group = g; want.set(g.id, gn);
      if (expanded.has(g.id)) for (const b of g.bots) {
        const bn = nodeMap.get(b.name) || makeNode(b.name, "bot", b, gn);
        bn.bot = b; want.set(b.name, bn);
      }
    }
    for (const [id, n] of nodeMap) if (!want.has(id)) n.el.remove();      // closed galaxies fold up
    nodeMap.clear(); for (const [id, n] of want) nodeMap.set(id, n);
    nodes = [...want.values()];
    // links: bot to bot when both are showing; bot to the other galaxy when that one is closed;
    // galaxy to galaxy when neither bot is showing
    links = []; const seen = new Set();
    const add = (a, b, ghost) => {
      if (!a || !b || a === b) return;
      const key = [a.id, b.id].sort().join("|"); if (seen.has(key)) return; seen.add(key);
      links.push({ a, b, ghost, phase: Math.random() });
    };
    for (const l of data.links) {
      const ba = byId(l.a), bb = byId(l.b); if (!ba || !bb || ba.retired || bb.retired) continue;
      const ga = groupOf(ba), gb = groupOf(bb); if (!ga || !gb) continue;
      const na = nodeMap.get(l.a), nb = nodeMap.get(l.b);
      if (na && nb) add(na, nb, ga !== gb);
      else if (na && ga !== gb) add(na, nodeMap.get(gb.id), true);
      else if (nb && ga !== gb) add(nb, nodeMap.get(ga.id), true);
      else if (ga !== gb) add(nodeMap.get(ga.id), nodeMap.get(gb.id), false);
    }
    for (const n of nodes) n.related = new Set(n.parent ? [n.parent.id] : []);
    for (const n of nodes) if (n.parent) n.parent.related.add(n.id);
    for (const l of links) { l.a.related.add(l.b.id); l.b.related.add(l.a.id); }
    for (const n of nodes) n.el.classList.toggle("sel", n.id === selected);
    for (const n of nodes) if (n.kind === "group") n.el.classList.toggle("open", expanded.has(n.id));
    relayout(true);
    paintLive();
  }
  function build() {
    document.getElementById("live").classList.toggle("off", !data.runner.running);
    document.getElementById("botCount").textContent = data.bots.length;
    makeGroups();
    for (const n of nodeMap.values()) n.el.remove();
    nodeMap.clear(); nodes = [];
    syncNodes();
    const keep = selected;
    selected = null;
    select(keep || location.hash.slice(1) || "all", true);
    paintLive();
  }

  // Bot data refresh: swap in new numbers; redraw the panel only if that bot really changed.
  const botKey = b => JSON.stringify([b.status, b.qty, b.trade_count, b.latest, b.plan && b.plan.next]);
  async function refresh() {
    let d; try { d = await loadData(); } catch (e) { paintLive(); return; }
    if (d.generated === data.generated) { paintLive(); return; }
    const before = selected && byId(selected) ? botKey(byId(selected)) : null;
    const statusChanged = d.bots.some(b => { const o = data.bots.find(x => x.name === b.name); return !o || o.status !== b.status; });
    data = d;
    makeGroups();
    const countChanged = data.bots.length !== nodes.filter(n => n.kind === "bot").length + groups.filter(g => !expanded.has(g.id)).reduce((s, g) => s + g.bots.length, 0);
    for (const n of nodes) { if (n.kind === "bot") n.bot = byId(n.id) || n.bot; if (n.kind === "group") n.group = groupById(n.id) || n.group; }
    if (countChanged) syncNodes(); else if (statusChanged) relayout(false);
    document.getElementById("live").classList.toggle("off", !data.runner.running);
    const p = document.getElementById("panel"), y = p.scrollTop;
    if (selected === "all") { renderAll(); p.scrollTop = y; }
    else if (groupById(selected)) { /* keep the chart; numbers update live */ }
    else if (selected && botKey(byId(selected)) !== before) renderBot(byId(selected));
    paintLive();
  }

  new ResizeObserver(() => { layout(); if (reduce) draw(0); }).observe(stage);
  layout();
  requestAnimationFrame(loop);
  loadData()
    .then(d => { data = d; build(); if (reduce) draw(0); tick(); setInterval(tick, 5000); setInterval(refresh, 60000); })
    .catch(() => { panelIn.innerHTML = `<p class="err">Couldn't load the bot data. Try refreshing the page.</p>`; document.getElementById("liveText").textContent = "No data"; });
})();
</script>
